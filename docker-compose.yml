services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gitwatcher
      POSTGRES_USER: gitwatcher
      POSTGRES_PASSWORD: gitwatcher
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitwatcher -d gitwatcher"]
      interval: 5s
      timeout: 5s
      retries: 10

  gitwatcher:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  postgres-data:
